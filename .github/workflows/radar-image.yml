# Image of this fork: upstream plus the fixes the Radar needs before upstream
# ships them (high-quality link preview, PR #207). Built on a native arm64
# runner because the Radar server is ARM. The upstream workflow that publishes
# to Docker Hub stays disabled in this fork: it needs the upstream secrets.
name: Fork image (arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=$(cat VERSION)-radar.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/evolution-go:latest
            ghcr.io/${{ github.repository_owner }}/evolution-go:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
